<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Cat Breeding</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="counter-container">
        <h1>Cat Genetics</h1>
        <div class="radio-group">
        <label>
            <input type="radio" name="menuToggle" value="nwshort" checked>Solids (common)
        </label>
        <label style="margin-left: 15px;">
            <input type="radio" name="menuToggle" value="nwlong"> Solids (persian)
        </label>
        <label>
            <input type="radio" name="menuToggle" value="lwshort" checked>Low white (common)
        </label>
        <label style="margin-left: 15px;">
            <input type="radio" name="menuToggle" value="lwlong"> Low white (persian)
        </label>
        <label>
            <input type="radio" name="menuToggle" value="hwshort" checked>High white (common)
        </label>
        <label style="margin-left: 15px;">
            <input type="radio" name="menuToggle" value="hwlong"> High white (persian)
        </label>
        <label>
            <input type="radio" name="menuToggle" value="nwpaws" checked>White glove (common)
        </label>
        <label style="margin-left: 15px;">
            <input type="radio" name="menuToggle" value="nwpaws"> White glove (persian)
        </label>            
    </div>

    <!-- Dropdown 1: short hair solids -->
    <div id="nwshortContainer" class="dropdown-container active">
        <label for="nwshortSelect">Solid/Tabby Shorthairs:</label><br>
        <select id="nwshortSelect">
            <option value="__ __ __ __ __ L_ WW ii C_ G_">White Solid Shorthair</option>
            <option disabled>-- Solids</option>            
            <option value="B_ D_ o_ aa __ L_ ww ii C_ G_">Black Solid Shorthair</option>
            <option value="B_ dd o_ aa __ L_ ww ii C_ G_">Blue Solid Shorthair</option>
            <option value="B_ dd o_ aa __ L_ ww ii C_ G_">Chocolate Solid Shorthair</option>
            <option value="b_ dd o_ aa __ L_ ww ii C_ G_">Lilac Solid Shorthair</option>
            <option value="b1b1 D_ o_ aa __ L_ ww ii C_ G_">Cinnamon Solid Shorthair</option>
            <option value="b1b1 dd o_ aa __ L_ ww ii C_ G_">Fawn Solid Shorthair</option>
            <option disabled>-- Tabby (Mackerel)</option>
            <option value="__ D_ OO __ McMc L_ ww ii C_ G_">Red Tabby Shorthair</option>
            <option value="__ dd OO __ McMc L_ ww ii C_ G_">Cream Tabby Shorthair</option>
            <option value="B_ D_ o_ A_ McMc L_ ww ii C_ G_">Brown Tabby Shorthair</option>
            <option value="bb D_ o_ A_ McMc L_ ww ii C_ G_">Chocolate Tabby Shorthair</option>
            <option value="B_ dd o_ A_ McMc L_ ww ii C_ G_">Blue Tabby Shorthair</option>
            <option value=""bb dd o_ A_ McMc L_ ww ii C_ G_">Lilac Tabby Shorthair</option>
            <option value="b1b1 D_ o_ A_ McMc L_ ww ii C_ G_">Cinnamon Tabby Shorthair</option>
            <option value="b1b1 dd o_ A_ McMc L_ ww ii C_ G_">Fawn Tabby Shorthair</option>
            <option disabled>-- Bengal</option>
            <option value="B_ D_ o_ A_ SpSp L_ ww ii C_ G_">Black Bengal Tabby Shorthair</option>
            <option value="B_ dd o_ A_ SpSp L_ ww ii C_ G_">Blue Bengal Shorthair</option>
            <option value="bb D_ o_ A_ SpSp L_ ww I_ C_ G_">Chocolate Bengal Shorthair</option>
            <option value="bb dd o_ A_ Sp_ L_ ww I_ C_ G_">Lilac Bengal Shorthair</option>
            <option disabled>-- Tortie and Torbie</option>
            <option value="B_ D_ Oo aa __ L_ ww I_ C_ G_">Black Tortie Shorthair</option>
            <option value="B_ D_ Oo A_ __ L_ ww I_ C_ G_">Black Torbie Shorthair</option>
            <option value="B_ dd Oo aa __ L_ ww I_ C_ G_">Blue Tortie Shorthair</option>
            <option value="B_ dd Oo A_ __ L_ ww I_ C_ G_">Blue Torbie Shorthair</option>            
            <option value="bb D_ Oo aa __ L_ ww ii C_ G_">Chocolate Tortie Shorthair</option>
            <option value="b_ dd Oo aa __ L_ ww I_ C_ G_
            <option value="orange">Fawn Tortie Shorthair</option>
            <option disabled>-- Smoke Silver or Sable</option>
            <option value="orange">Black Smoke Shorthair</option>   
            <option value="orange">Blue Smoke Shorthair</option>
            <option value="orange">Silver Tabby Shorthair</option>
            <option value="orange">Silver Tarnished Shorthair</option>
            <option value="orange">Silver Bengal Shorthair</option>
            <option value="orange">Seal Sable Shorthair</option>
            <option value="orange">Blue Sable Shorthair</option> 
            <option value="orange">Chocolate Sable Shorthair</option>

            <option value="orange">Cream Sable Shorthair</option>
            <option disabled>-- Mink</option>  
            <option value="orange">Seal Mink Shorthair</option>
            <option value="orange">Blue Mink Shorthair</option>

            <option value="orange">Lilac Mink Shorthair</option>
            <option value="orange">Cinnamon Mink Shorthair</option>
            <option value="orange">Fawn Mink Shorthair</option>
            <option value="orange">Red Mink Shorthair</option>
            <option value="orange">Cream Mink Shorthair</option>
            <option disabled>-- Point</option>  
            <option value="orange">Seal Point Shorthair</option>
            <option value="orange">Seal Tabby Point Shorthair</option>
            <option value="orange">Seal Tortie Point Shorthair</option>
            <option value="orange">Snow Bengal Shorthair</option>
            <option value="orange">Blue Point Shorthair</option>

            <option value="orange">Cream Point Shorthair</option>
            <option value="orange">Golden Tabby Shorthair</option>
            <option value="orange">Chinchilla Shorthair</option>
        </select>
    </div>

    <!-- Dropdown 2: Vegetables (Hidden by default) -->
    <div id="vegetablesContainer" class="dropdown-container">
        <label for="vegSelect">Choose a Vegetable:</label><br>
        <select id="vegSelect">
            <option value="carrot">Carrot</option>
            <option value="broccoli">Broccoli</option>
            <option value="spinach">Spinach</option>
        </select>
    </div>
        <div id="mother-input">
        <label>Mother:</label><input type="text" name="mother" value="__ __ __ __ __ L_ W_ ii C_ G_" />
        </div>
        <div id="father-input">
        <label>Father:</label><input type="text" name="father" value="__ __ __ __ __ L_ W_ ii C_ G_" />
        </div>
        <div id="baby-genetics">
        __ __ __ __ __ L_ W_ ii C_ G_
        </div>
        <button id="generate-btn">Click for baby genes</button>
        <button id="reset-btn">Reset</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
